services:
  - type: web
    name: teamnova-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PATH
        value: /api
      - key: NODE_VERSION
        value: 22
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_EXPIRES_IN
        value: 1d
      - key: MONGO_URI
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
